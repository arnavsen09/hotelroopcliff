<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142E25"/>
      <stop offset="50%" stop-color="#0D1E18"/>
      <stop offset="100%" stop-color="#07100D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#AA8222"/>
      <stop offset="100%" stop-color="#F2E3B5"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Luxurious Rounded Bezel Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8"/>

  <!-- Royal Crown -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <path d="M21 21 L24 28 L32 22 L40 28 L43 21 L41 30 L23 30 Z"/>
    <circle cx="21" cy="20" r="1.5"/>
    <circle cx="32" cy="18" r="1.8"/>
    <circle cx="43" cy="20" r="1.5"/>
    <rect x="23" y="30.5" width="18" height="1.8" rx="0.5"/>
  </g>

  <!-- Interlocked "RC" Monogram -->
  <text x="32" y="47"
        text-anchor="middle"
        font-family="'Cinzel', 'Playfair Display', 'Georgia', serif"
        font-size="16"
        font-weight="700"
        letter-spacing="1"
        fill="url(#goldGrad)"
        filter="url(#goldGlow)">
    RC
  </text>

  <!-- Subtle Bottom Flourish -->
  <path d="M26 51 Q32 53 38 51" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.85"/>
  <circle cx="32" cy="52" r="0.8" fill="url(#goldGrad)"/>
</svg>
